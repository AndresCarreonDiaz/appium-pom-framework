name: Mobile tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint

  android:
    needs: static-checks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run apps

      # Hardware acceleration makes the emulator usable on Linux runners.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run tests on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          ANDROID_PLATFORM_VERSION: '14'
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          disable-animations: true
          script: npm run test:android

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-results
          path: |
            reports/
            screenshots/

  ios:
    needs: static-checks
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run apps

      - name: Pick the newest installed iOS runtime
        run: |
          VERSION=$(xcrun simctl list runtimes | grep -E '^iOS' | tail -1 | sed -E 's/^iOS ([0-9.]+) .*/\1/')
          echo "IOS_PLATFORM_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Run tests on iOS simulator
        env:
          IOS_DEVICE_NAME: iPhone 16
        run: npm run test:ios

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-results
          path: |
            reports/
            screenshots/
